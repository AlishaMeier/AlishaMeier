<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 16" width="800" height="16" role="img" aria-label="neon divider">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
<stop offset="0" stop-color="#7b2cbf"/><stop offset=".5" stop-color="#ff2e97"/><stop offset="1" stop-color="#7b2cbf"/>
<animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="4s" repeatCount="indefinite"/>
</linearGradient>
<filter id="b" x="-5%" y="-300%" width="110%" height="700%"><feGaussianBlur stdDeviation="2.5"/></filter>
</defs>
<rect x="10" y="6" width="780" height="4" rx="2" fill="url(#g)" filter="url(#b)" opacity=".8"/>
<rect x="10" y="7" width="780" height="2" rx="1" fill="url(#g)"/>
<circle cx="400" cy="8" r="4" fill="#ff2e97"><animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/></circle>
</svg>
